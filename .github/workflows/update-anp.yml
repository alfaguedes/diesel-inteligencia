
name: Atualizar dados da ANP e publicar o site

on:
  workflow_dispatch:
  schedule:
    - cron: "15 12 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Atualizar dados
        run: python diesel-inteligencia/scripts/update_anp.py

      - name: Salvar historico
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diesel-inteligencia/data/
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza dados ANP"
            git push
          fi

      - uses: actions/configure-pages@v5
        with:
          enablement: true 

      - uses: actions/upload-pages-artifact@v3
        with:
          path: "diesel-inteligencia"

      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
